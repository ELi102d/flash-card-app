<!DOCTYPE html>
<html>
  <head>
    <title>Flash Card App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
        background-color: #f0f0f0;
      }

      .container {
        text-align: center;
      }

      .card {
        width: 300px;
        height: 200px;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 20px;
        margin: 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        background-color: white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Flash Card App</h1>
      <div class="card">
        <div class="card-front">Question</div>
        <div class="card-back">Answer</div>
      </div>
      <button id="nextBtn">Next Card</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
